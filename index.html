    <!-- ?v=2 — сброс кэша фавикона (Safari цепко держит старый значок).
         ico/png — для браузеров, не берущих SVG-фавикон (Safari в их числе). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" sizes="any" href="/favicon.ico?v=2" />
    <link rel="canonical" href="https://lexai.app/" />
    <link rel="alternate" hreflang="x-default" href="https://lexai.app/" />
    <script>
      // SPA: одна index.html на все маршруты — подставляем канонический URL
      // текущей страницы (краулеры, исполняющие JS, увидят правильный).
      (function () {
        try {
          var href = 'https://lexai.app' + (location.pathname === '/' ? '/' : location.pathname);
          var c = document.querySelector('link[rel="canonical"]');
          if (c) c.setAttribute('href', href);
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute('content', href);
        } catch (e) {}
      })();
    </script>

    <!-- Apply the saved theme BEFORE first paint so full-page loads (e.g. the
         return from Google sign-in) don't flash white/dark for an instant. -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('lexai.ui.prefs') || '{}');
          // "system" is the standard look and intentionally equals light.
          var dark = prefs.theme === 'dark';
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = dark ? '#0b0b0a' : '#fafaf9';
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', dark ? '#0b0b0a' : '#fafaf9');
          // Apply saved language + direction (Arabic is RTL) before first paint.
          var lang = localStorage.getItem('lexai.lang');
          if (lang) {
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          }
        } catch (e) {
          /* first visit — defaults apply */
        }
      })();
    </script>
    <!-- Anti-clickjacking (OWASP legacy frame-buster). `frame-ancestors` is
         ignored in <meta> CSP and we don't control the static host's headers,
         so the defence ships with the page itself: the app stays hidden unless
         it is the top window — even inside a sandboxed iframe where the
         top-navigation escape below is blocked. -->
    <style id="antiClickjack">
      body {
        display: none !important;
      }
    </style>
    <script>
      (function () {
        if (self === top) {
          var s = document.getElementById('antiClickjack');
          if (s) s.parentNode.removeChild(s);
        } else {
          top.location = self.location;
        }
      })();
    </script>
    <!-- Шрифты самохостятся (public/fonts/, скачаны с Google Fonts один раз):
         IP посетителей не уходит в Google (немецкие суды признавали внешнюю
         загрузку Google Fonts нарушением GDPR), и первый рендер не зависит от
         чужого CDN. Async-паттерн (media swap) сохранён — не блокирует paint. -->
    <!-- Preload критичных начертаний интерфейса (latin+cyr): woff2 стартуют с
         первых байт HTML, а не после цепочки fonts.css → при font-display:
         optional Inter успевает к первому кадру вместо Arial-фолбэка на
         холодном визите. Playfair не прелоадим: он нужен только лендингу.
         crossorigin обязателен даже same-origin — иначе двойная загрузка. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-cyr.woff2" crossorigin />
    <link href="/fonts/fonts.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="/fonts/fonts.css" rel="stylesheet" />
    </noscript>
