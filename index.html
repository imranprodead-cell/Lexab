<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="LexAI — AI contract intelligence platform." />
    <title>LexAI — Contract Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://lexai.app/" />
    <script>
      // SPA: одна index.html на все маршруты — подставляем канонический URL
      // текущей страницы (краулеры, исполняющие JS, увидят правильный).
      (function () {
        try {
          var href = 'https://lexai.app' + (location.pathname === '/' ? '/' : location.pathname);
          var c = document.querySelector('link[rel="canonical"]');
          if (c) c.setAttribute('href', href);
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute('content', href);
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Social preview card (Open Graph + Twitter) -->

    <!-- Apply the saved theme BEFORE first paint so full-page loads (e.g. the
         return from Google sign-in) don't flash white/dark for an instant. -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('lexai.ui.prefs') || '{}');
          // "system" is the standard look and intentionally equals light.
          var theme = prefs.theme === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.backgroundColor = theme === 'light' ? '#ffffff' : '#101014';
          // Apply saved language + direction (Arabic is RTL) before first paint.
          var lang = localStorage.getItem('lexai.lang');
          if (lang) {
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          }
        } catch (e) {
          /* first visit — defaults apply */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load async (media swap) so they never block first paint. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"

      media="print"
      onload="this.media='all'"
