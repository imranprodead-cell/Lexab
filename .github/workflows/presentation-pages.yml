# Публикует на GitHub Pages ТОЛЬКО папку «Presentation Lexhackathon»
# (презентация LexHackathon 2026 с анимациями):
#   https://imranprodead-cell.github.io/Lexab/Lexab-RU.html
#   https://imranprodead-cell.github.io/Lexab/Lexab-UZ.html
# К продукту отношения не имеет: сборка сайта берёт только src/ и public/,
# сервер — только server/. Включается один раз в настройках репозитория:
# Settings → Pages → Source: GitHub Actions.
name: Presentation (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'Presentation Lexhackathon/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'Presentation Lexhackathon'
      - id: deployment
        uses: actions/deploy-pages@v4
