# CI: runs on every push and pull request — lint, typecheck, tests, build, and
# a dependency audit for the frontend and the server. Requires the repo to live
# on GitHub. (The paid RAG eval — `npm run eval` — is intentionally NOT in CI;
# it calls the Anthropic API and is run manually before/after ranking changes.)
name: CI

on:
  # Раньше стояло `branches: [main]` — на рабочих ветках CI не запускался вовсе,
  # и красные проверки обнаруживались уже после вливания (аудит 2026-08-03).
  push:
    branches: ['**']
  pull_request:

# Минимальные права: работам нужен только доступ на чтение репозитория.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · typecheck · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Версия берётся из .nvmrc — CI и деплой не могут разъехаться.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Gate on lint ERRORS (real problems); pre-existing HMR warnings don't block.
      - run: npx eslint . --ext ts,tsx --report-unused-disable-directives
      - run: npx tsc --noEmit
      - run: npm test
      # Сборке нужен VITE_SITE_ORIGIN: без него она падает намеренно («пустой
      # canonical хуже отсутствующего»), а .env в репозитории нет и быть не
      # должно. Берём пример конфига, а не хардкодим домен в workflow: домен
      # обязан жить в одной точке. Без этой строки шаг сборки в CI не выполнялся
      # вовсе и валил проверку с 2026-08-06 (ba33494).
      - run: cp .env.example .env
      - run: npm run build
      # Блокирующий гейт: реальные уязвимости в ПРОДАКШЕН-зависимостях.
      - run: npm audit --omit=dev --audit-level=high
      # Неблокирующий обзор всего дерева (включая сборочные инструменты): держит
      # проблему на виду, но не роняет сборку из-за dev-only advisory.
      # ИЗВЕСТНОЕ: react-router 6.x — 2 moderate, закрываются только мажором 7.x
      # (отдельная задача). До миграции не принимать код, где navigate() или
      # <Link to> получают путь из внешних данных.
      - run: npm audit --audit-level=moderate
        continue-on-error: true

  server:
    name: Server (lint · typecheck · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Настоящий Postgres с pgvector: раньше серверные тесты шли ТОЛЬКО на PGlite,
    # и Postgres-специфичные пути (advisory-локи, векторный поиск, генерируемая
    # колонка tsv) не выполнялись в CI ни разу (аудит 2026-08-03).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lexai
          POSTGRES_PASSWORD: lexai
          POSTGRES_DB: lexai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Незаявленная зависимость резолвится из node_modules ФРОНТА и локально
      # невидима — именно так `undici` доехал до прода (аудит 2026-08-03).
      - run: npm run check-deps
      - run: npm run lint
      - run: npm run typecheck
      # 1) Быстрый прогон на PGlite (как раньше).
      - run: npm test
      # 2) Миграции и санити-проверки движка на НАСТОЯЩЕМ Postgres — включая
      #    «RLS на всех таблицах» и права публичных ролей.
      - run: npm run verify:db
        env:
          DATABASE_URL: postgres://lexai:lexai@localhost:5432/lexai
          PG_POOL_MAX: '4'
          ALLOW_INSECURE_SECRETS: '1'
      - run: npm audit --omit=dev --audit-level=high
